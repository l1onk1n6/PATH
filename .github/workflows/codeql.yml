name: CodeQL

# Statische Sicherheitsanalyse des TypeScript/JavaScript-Codes.
#
# Bewusst "Advanced Setup" (diese Datei) statt des Default Setup aus den
# Repo-Einstellungen: nur so ist nachlesbar und versioniert, WAS geprueft wird.
# Gegenprobe vor dem Anlegen (15.09.): die Workflow-Liste des Repos enthielt
# keinen dynamischen Eintrag `dynamic/github-code-scanning/codeql` — Default
# Setup war also aus, die beiden Wege beissen sich hier nicht.
#
# Nur `javascript-typescript`. Java steht zwar in der Sprachstatistik, aber mit
# 1,3 KB Android-Kleber; CodeQL muesste dafuer einen Gradle-Build fahren, was
# lange dauert und wenig findet. PLpgSQL unterstuetzt CodeQL nicht.
#
# Action-Referenzen sind wie im ganzen Repo auf den Commit-SHA gepinnt.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Montags 04:17 UTC. Der Zeitplan ist der eigentliche Wert: er findet
    # Schwachstellen, die erst nach dem Merge als Advisory bekannt werden.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # noetig, damit die Funde als Alerts landen
      actions: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # Kein Build-Schritt: JavaScript/TypeScript wird von CodeQL direkt
      # analysiert, ein npm-Build wuerde nur Zeit kosten.
      - name: Analyse ausfuehren
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          category: /language:javascript-typescript
